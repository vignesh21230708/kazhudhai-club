services:
  - type: web
    name: kazhudhai-club
    env: python
    branch: main
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 100 --bind 0.0.0.0:$PORT --chdir backend wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kazhudhai-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: SOCKETIO_ASYNC_MODE
        value: threading

databases:
  - name: kazhudhai-db
    plan: free
    databaseName: kazhudhaidb
    user: kazhudhai
