databases:
  - name: kazhudhai-db
    plan: free
    databaseName: kazhudhaidb
    user: kazhudhai

services:
  - type: web
    name: kazhudhai-club
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --chdir backend wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kazhudhai-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: SOCKETIO_ASYNC_MODE
        value: eventlet
